name: Deploy to GitHub Pages

# Deploy-Weg wie beim Fotodoku-Tool: dist/ wird in den Branch "gh-pages"
# gepusht, GitHub Pages ist auf diesen Branch konfiguriert
# (Settings -> Pages -> Source: Deploy from a branch). Der Weg ueber
# actions/deploy-pages blieb dort wiederholt in der Warteschlange haengen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base = /<repo-name>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Der Gemini-Schluessel wird mit ausgeliefert, damit jeder die Seite
          # ohne Einrichtung benutzen kann. Er steht deshalb NICHT im Quelltext,
          # sondern als Actions-Geheimnis, und laesst sich dort austauschen,
          # ohne etwas am Programm zu aendern.
          VITE_GEMINI_SCHLUESSEL: ${{ secrets.VITE_GEMINI_SCHLUESSEL }}

      - name: Push dist to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
